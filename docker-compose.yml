services:
  postgres:
    image: postgres:17-alpine
    container_name: sharddns-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharddns}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharddns}
      POSTGRES_DB: ${POSTGRES_DB:-sharddns}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    container_name: sharddns-nats
    command: ["-js=false"]

  sharddnsd:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: sharddnsd
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${DNS_PORT:-53}:53/udp"
      - "${DNS_PORT:-53}:53/tcp"
      - "${API_PORT:-9053}:9053"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sharddns}:${POSTGRES_PASSWORD:-sharddns}@postgres:5432/${POSTGRES_DB:-sharddns}?sslmode=disable
      DNS_ADDR: :53
      API_ADDR: :9053
      API_TOKEN: ${API_TOKEN:-}
      WORKERS: ${WORKERS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-0}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-100000}
      NATS_URL: nats://nats:4222

volumes:
  postgres-data:
