name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            name="sharddns_${VERSION}_${os}_${arch}"
            mkdir -p "build/$name"
            for bin in sharddnsd sharddns; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "build/$name/${bin}${ext}" "./cmd/${bin}"
            done
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/${name}.zip" "$name")
            else
              tar -C build -czf "dist/${name}.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
